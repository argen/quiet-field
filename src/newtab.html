<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Tab</title>
    <!--
      Critical CSS is inlined so the surface paints in one pass with no external
      request and no flash. The gallery-wall tone is set from prefers-color-scheme
      *before any JS*, so even the first frame is a calm wall, never white.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --qf-wall: #1a1613;      /* warm near-black gallery wall */
        /* Solid, contrast-checked ink against the wall (WCAG AA, >=4.5:1). */
        --qf-ink: #ece4d6;       /* ~14:1 on the dark wall */
        --qf-ink-dim: #b3a999;   /* ~7.6:1 on the dark wall */
      }
      @media (prefers-color-scheme: light) {
        :root {
          --qf-wall: #cfc6b6;    /* warm linen wall */
          --qf-ink: #221c14;     /* ~9.7:1 on the linen wall */
          --qf-ink-dim: #3e362b; /* ~6.3:1 on the linen wall */
        }
      }
      html, body {
        margin: 0; height: 100%; overflow: hidden;
        background: var(--qf-wall);
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      }
      #app { position: fixed; inset: 0; }

      .qf-stage {
        position: absolute; inset: 0; background: var(--qf-wall);
        display: grid; place-items: center; overflow: hidden;
      }
      .qf-defs { position: absolute; width: 0; height: 0; pointer-events: none; }

      .qf-frame {
        display: flex; flex-direction: column; align-items: center; gap: 2.4vmin;
        z-index: 1;
      }
      .qf-card {
        position: relative; overflow: hidden;
        height: min(74vh, calc(86vw / var(--a, 0.8)));
        border-radius: 2px;
        box-shadow: 0 3vmin 9vmin -2vmin rgba(0,0,0,0.6),
                    0 0 0 1px rgba(0,0,0,0.25);
        background: var(--qf-wall);
      }
      .qf-fieldwrap { position: absolute; inset: 0; }
      .qf-band { position: absolute; }
      .qf-square { position: absolute; border-radius: 1px; }
      .qf-zip { position: absolute; top: 0; bottom: 0; }
      .qf-veil { position: absolute; pointer-events: none; }
      .qf-grid-line { position: absolute; left: 0; right: 0; }
      .qf-shard { position: absolute; inset: 0; }
      .qf-img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .qf-grain {
        position: absolute; inset: 0; pointer-events: none; mix-blend-mode: overlay;
      }
      .qf-vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 0;
        background: radial-gradient(130% 130% at 50% 42%, transparent 56%, rgba(0,0,0,0.34) 100%);
      }

      /* Full-bleed mode — the painting fills the screen. */
      .qf-stage--full .qf-frame { position: static; }
      .qf-stage--full .qf-card {
        position: absolute; inset: 0; height: 100%; width: 100%;
        border-radius: 0; box-shadow: none;
      }
      .qf-stage--full .qf-img { object-fit: cover; }
      .qf-stage--full .qf-caption {
        position: absolute; left: 0; right: 0; bottom: 4.5vh; z-index: 3;
      }
      /* Over arbitrary artwork the wall ink can't be trusted — lay down a
         protection scrim and use white text so contrast is guaranteed (WCAG AA)
         regardless of the painting underneath. */
      .qf-stage--full::after {
        content: ""; position: absolute; left: 0; right: 0; bottom: 0;
        height: 30vh; z-index: 2; pointer-events: none;
        background: linear-gradient(to top, rgba(0,0,0,0.72), rgba(0,0,0,0.34) 45%, transparent);
      }
      .qf-stage--full .qf-caption,
      .qf-stage--full .qf-corner__time { color: #fff; }
      .qf-stage--full .qf-cap-artist,
      .qf-stage--full .qf-cap-context,
      .qf-stage--full .qf-corner { color: rgba(255,255,255,0.88); }
      .qf-stage--full .qf-ambient { z-index: 3; }

      /* Caption — a quiet wall label beneath the painting. */
      .qf-caption {
        text-align: center; color: var(--qf-ink);
        font-size: clamp(13px, 1.25vw, 16px); letter-spacing: 0.03em;
        text-shadow: 0 1px 12px rgba(0,0,0,0.35);
        display: flex; flex-direction: column; gap: 0.35em; line-height: 1.3;
      }
      .qf-cap-title em { font-style: italic; }
      .qf-cap-artist, .qf-cap-context {
        font-size: 0.82em; color: var(--qf-ink-dim); letter-spacing: 0.05em;
      }

      /* Ambient corner — time / place. Fades after a beat; returns on hover. */
      .qf-ambient { position: fixed; left: 3.4vmin; bottom: 3vmin; z-index: 2; pointer-events: none; }
      .qf-ambient--fade { animation: qf-fade 5s ease forwards; }
      .qf-stage:hover .qf-ambient--fade { animation: none; opacity: 1; }
      @keyframes qf-fade { 0%, 50% { opacity: 1; } 100% { opacity: 0; } }
      .qf-corner {
        margin: 0; font-size: clamp(12px, 1.1vw, 14px);
        color: var(--qf-ink-dim); letter-spacing: 0.05em;
        text-shadow: 0 1px 12px rgba(0,0,0,0.35);
      }
      .qf-corner__sep { opacity: 0.55; margin: 0 0.6em; }

      /* Settings cog — persistent, always reachable. A consistent dark disc +
         light icon keeps the control >=3:1 over any wall or artwork. */
      .qf-settings {
        position: fixed; top: 2.4vmin; right: 2.4vmin; z-index: 6;
        display: grid; place-items: center; width: 40px; height: 40px;
        padding: 0; border: 0; border-radius: 50%; cursor: pointer;
        color: #f4efe6; background: rgba(0,0,0,0.5); backdrop-filter: blur(3px);
        transition: background 0.25s ease;
      }
      .qf-settings:hover, .qf-settings:focus-visible { background: rgba(0,0,0,0.68); }
      .qf-settings:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

      /* Inline settings panel — opens and closes over the artwork. */
      .qf-panel {
        position: fixed; top: 7.5vmin; right: 2.4vmin; z-index: 5; width: 280px;
        padding: 16px 18px; border-radius: 12px;
        background: rgba(20, 17, 14, 0.86); backdrop-filter: blur(14px);
        color: var(--qf-ink); border: 1px solid rgba(255,255,255,0.12);
        box-shadow: 0 18px 48px -12px rgba(0,0,0,0.6);
        font-size: 14px; letter-spacing: 0.02em;
        opacity: 0; transform: translateY(-6px) scale(0.98);
        transform-origin: top right; pointer-events: none;
        transition: opacity 0.18s ease, transform 0.18s ease;
      }
      @media (prefers-color-scheme: light) {
        .qf-panel { background: rgba(245, 240, 232, 0.9); border-color: rgba(0,0,0,0.1); }
      }
      .qf-panel--open { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
      .qf-panel__head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
      .qf-panel__title { font-style: italic; opacity: 0.85; }
      .qf-panel__close {
        border: 0; background: transparent; color: inherit; cursor: pointer;
        font-size: 22px; line-height: 1; opacity: 0.6; padding: 0 4px;
      }
      .qf-panel__close:hover { opacity: 1; }
      .qf-panel__row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 0; }
      .qf-panel__note { margin: 8px 0 0; font-size: 12px; font-style: italic; opacity: 0.8; }
      .qf-seg { display: inline-flex; border: 1px solid rgba(255,255,255,0.2); border-radius: 999px; overflow: hidden; }
      @media (prefers-color-scheme: light) { .qf-seg { border-color: rgba(0,0,0,0.18); } }
      .qf-seg button {
        background: transparent; color: inherit; border: 0; cursor: pointer;
        padding: 4px 12px; font: inherit; opacity: 0.72;
      }
      .qf-seg button[aria-pressed="true"] { background: rgba(255,255,255,0.16); opacity: 1; }
      .qf-panel input[type="checkbox"] { width: 17px; height: 17px; accent-color: #b98d57; cursor: pointer; }

      @media (prefers-reduced-motion: reduce) {
        .qf-ambient--fade { animation: none; opacity: 1; }
        .qf-settings, .qf-panel { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./newtab.ts"></script>
  </body>
</html>
